<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vareli Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:20px;
  text-align:center;
}

header h1{
  margin:0;
  letter-spacing:4px;
}

.container{
  max-width:900px;
  margin:25px auto;
  padding:0 15px;
}

.panel{
  background:#fff;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

input,
select,
button{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}

button{
  background:#111;
  color:#fff;
  border:0;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:.9;
}

.fileBox{
  border:2px dashed #ccc;
  padding:20px;
  text-align:center;
  border-radius:12px;
  margin:10px 0;
}

.preview{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:10px;
  margin-top:10px;
}

.preview img{
  width:100%;
  height:100px;
  object-fit:cover;
  border-radius:10px;
}

.product{
  border:1px solid #eee;
  border-radius:14px;
  padding:15px;
  margin-top:15px;
  display:flex;
  gap:15px;
  align-items:center;
}

.product img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:10px;
}

.productInfo{
  flex:1;
}

.productInfo h3{
  margin:0 0 7px;
}

.delete{
  background:#c62828;
  width:auto;
  padding:10px 15px;
}

.small{
  color:#777;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <h1>VARELI</h1>
  <div>ADMIN PANEL</div>
</header>

<div class="container">

  <div class="panel">
    <h2>Ավելացնել ապրանք</h2>

    <input
      id="pName"
      type="text"
      placeholder="Ապրանքի անունը">

    <input
      id="pPrice"
      type="number"
      placeholder="Գին ֏">

    <select id="pCategory">
      <option value="all">Բոլորը</option>
      <option value="beauty">Beauty</option>
      <option value="accessories">Accessories</option>
      <option value="new">New</option>
    </select>

    <input
      id="pSizes"
      type="text"
      placeholder="Չափեր՝ 40,41,42,43">

    <div class="fileBox">
      <b>Ընտրել ապրանքի նկարները</b>
      <br>
      <span class="small">
        Կարող ես ընտրել մի քանի նկար միանգամից
      </span>

      <input
        id="pImages"
        type="file"
        accept="image/*"
        multiple
      >

      <div id="preview" class="preview"></div>
    </div>

    <button onclick="addProduct()">
      Ավելացնել ապրանքը
    </button>
  </div>


  <div class="panel">
    <h2>Ապրանքներ</h2>

    <div id="products"></div>
  </div>

</div>


<script>

const STORAGE_KEY = "vareli_products";

let products = [];

try{
  products =
    JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
}catch(e){
  products = [];
}


/* Նկարների նախադիտում */

document
  .getElementById("pImages")
  .addEventListener("change", function(){

    const preview =
      document.getElementById("preview");

    preview.innerHTML = "";

    Array.from(this.files).forEach(file => {

      const reader = new FileReader();

      reader.onload = function(e){

        const img =
          document.createElement("img");

        img.src = e.target.result;

        preview.appendChild(img);

      };

      reader.readAsDataURL(file);

    });

  });


/* Ապրանք ավելացնել */

function addProduct(){

  const name =
    document.getElementById("pName")
      .value.trim();

  const price =
    Number(
      document.getElementById("pPrice")
        .value
    );

  const category =
    document.getElementById("pCategory")
      .value;

  const sizes =
    document.getElementById("pSizes")
      .value
      .split(",")
      .map(s => s.trim())
      .filter(Boolean);

  const files =
    Array.from(
      document.getElementById("pImages").files
    );


  if(!name){
    alert("Գրիր ապրանքի անունը");
    return;
  }

  if(!price){
    alert("Գրիր ապրանքի գինը");
    return;
  }

  if(files.length === 0){
    alert("Ընտրիր առնվազն մեկ նկար");
    return;
  }


  /*
    Բոլոր նկարները վերածում ենք
    Base64-ի և պահում localStorage-ում
  */

  let images = [];

  let completed = 0;

  files.forEach(file => {

    const reader =
      new FileReader();

    reader.onload = function(e){

      images.push(e.target.result);

      completed++;

      if(completed === files.length){

        products.push({

          id: Date.now(),

          name: name,

          price: price,

          image: images[0],

          images: images,

          category: category,

          sizes: sizes

        });


        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(products)
        );


        alert("Ապրանքը ավելացվեց ✅");

        clearForm();

        renderProducts();

      }

    };

    reader.readAsDataURL(file);

  });

}


/* Form մաքրել */

function clearForm(){

  document.getElementById("pName").value = "";

  document.getElementById("pPrice").value = "";

  document.getElementById("pSizes").value = "";

  document.getElementById("pImages").value = "";

  document.getElementById("preview").innerHTML = "";

}


/* Ապրանքների ցուցադրում */

function renderProducts(){

  const box =
    document.getElementById("products");

  if(products.length === 0){

    box.innerHTML =
      "<p>Ապրանքներ դեռ չկան։</p>";

    return;

  }


  box.innerHTML =
    products.map(p => {

      const image =
        p.image ||
        (
          p.images &&
          p.images[0]
        ) ||
        "https://via.placeholder.com/300";


      const sizes =
        Array.isArray(p.sizes)
          ? p.sizes.join(", ")
          : (
              p.sizes || "Չափ չկա"
            );


      const imageCount =
        Array.isArray(p.images)
          ? p.images.length
          : 1;


      return `

        <div class="product">

          <img
            src="${image}"
            onerror="this.src='https://via.placeholder.com/300'"
          >

          <div class="productInfo">

            <h3>
              ${p.name}
            </h3>

            <div>
              <b>
                ${Number(p.price || 0).toLocaleString()} ֏
              </b>
            </div>

            <div class="small">
              Չափեր՝ ${sizes}
            </div>

            <div class="small">
              Նկարներ՝ ${imageCount}
            </div>

          </div>

          <button
            class="delete"
            onclick="deleteProduct(${p.id})"
          >
            Ջնջել
          </button>

        </div>

      `;

    }).join("");

}


/* Ապրանք ջնջել */

function deleteProduct(id){

  if(!confirm("Ջնջե՞լ այս ապրանքը։")){
    return;
  }

  products =
    products.filter(
      p => p.id !== id
    );

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(products)
  );

  renderProducts();

}


/* Սկզբնական ցուցադրում */

renderProducts();

</script>

</body>
</html>
