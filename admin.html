<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VARELI — Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f7f7f7;
color:#111;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.box{
background:#fff;
padding:20px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0 2px 10px #0001;
}

h1{
margin-bottom:10px;
}

input,select{
width:100%;
padding:13px;
margin:7px 0 12px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
}

button{
border:0;
padding:12px 16px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.add{
background:#111;
color:#fff;
width:100%;
}

.back{
background:#eee;
width:100%;
margin-top:10px;
}

.delete{
background:#e33;
color:#fff;
}

#imagePreview{
width:100%;
max-height:250px;
object-fit:contain;
display:none;
margin:10px 0;
border-radius:10px;
background:#eee;
}

.product{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 0;
border-bottom:1px solid #ddd;
gap:10px;
}

#adminPanel{
display:none;
}
</style>
</head>

<body>

<div class="container">

<div id="loginBox" class="box">

<h1>🔐 VARELI ADMIN</h1>

<p>Մուտքագրիր Admin-ի գաղտնաբառը</p>

<input
id="password"
type="password"
placeholder="Գաղտնաբառ">

<button onclick="login()" class="add">
Մուտք գործել
</button>

</div>


<div id="adminPanel">

<div class="box">

<h1>👨‍💼 VARELI ADMIN</h1>

<p>Ավելացրու նոր ապրանք</p>

<input
id="pName"
placeholder="Ապրանքի անուն">

<input
id="pPrice"
type="number"
placeholder="Գին ֏">
  
<input
id="pSizes"
type="text"
placeholder="Չափեր (օր․ 40,41,42,43)">
  
<label>Նկար ընտրել հեռախոսից</label>

<input
id="pImage"
type="file"
accept="image/*">

<img id="imagePreview">

<select id="pCategory">

<option value="beauty">
Beauty
</option>

<option value="accessories">
Աքսեսուարներ
</option>

<option value="new">
Նորույթ
</option>

</select>

<button onclick="addProduct()" class="add">
➕ Ավելացնել ապրանք
</button>

</div>


<div class="box">

<h2>📦 Ապրանքների կառավարում</h2>

<div id="adminProducts"></div>

</div>


<button onclick="location.href='index.html'" class="back">
← Վերադառնալ խանութ
</button>

</div>

</div>


<script>

let products =
JSON.parse(localStorage.getItem("vareli_products"))
||
[
{
id:1,
name:"Vareli Beauty Cream",
price:5000,
image:"https://images.unsplash.com/photo-1556228578-8c89e6adf883",
category:"beauty"
},

{
id:2,
name:"Vareli Lip Tint",
price:6500,
image:"https://images.unsplash.com/photo-1586495777744-4413f21062fa",
category:"beauty"
},

{
id:3,
name:"Vareli Bag",
price:12000,
image:"https://images.unsplash.com/photo-1548036328-c9fa89d128fa",
category:"accessories"
},

{
id:4,
name:"Vareli New Collection",
price:15000,
image:"https://images.unsplash.com/photo-1529139574466-a303027c1d8b",
category:"new"
}
];


let selectedImage="";


function login(){

let password=
document.getElementById("password").value;

if(password!=="Ando0987."){

alert("❌ Սխալ գաղտնաբառ");

return;

}

document.getElementById("loginBox").style.display="none";

document.getElementById("adminPanel").style.display="block";

renderAdmin();

}


document
.getElementById("pImage")
.addEventListener("change",function(e){

let file=e.target.files[0];

if(!file)return;

let reader=new FileReader();

reader.onload=function(event){

selectedImage=event.target.result;

let preview=
document.getElementById("imagePreview");

preview.src=selectedImage;

preview.style.display="block";

};

reader.readAsDataURL(file);

});


function save(){

localStorage.setItem(
"vareli_products",
JSON.stringify(products)
);

}


function addProduct(){

let name=
document.getElementById("pName").value;

let price=
Number(document.getElementById("pPrice").value);

let category=
document.getElementById("pCategory").value;
let sizes =
document.getElementById("pSizes").value
.split(",")
.map(s => s.trim())
.filter(Boolean);

if(!name || !price){

alert("Լրացրու անունը և գինը։");

return;

}


let image=
selectedImage ||
"https://via.placeholder.com/500";


products.push({

id:Date.now(),

name:name,

price:price,

image:image,

category:category
  
sizes:sizes
  
});


save();


document.getElementById("pName").value="";
  
document.getElementById("pSizes").value="";
  
document.getElementById("pPrice").value="";

document.getElementById("pImage").value="";

selectedImage="";

document.getElementById("imagePreview").style.display="none";


renderAdmin();

alert("✅ Ապրանքը ավելացվեց։");

}


function renderAdmin(){

document.getElementById("adminProducts").innerHTML=

products.map(p=>`

<div class="product">

<div>

<b>${p.name}</b>

<br>

${p.price.toLocaleString()} ֏

</div>

<button
class="delete"
onclick="deleteProduct(${p.id})">

Ջնջել

</button>

</div>

`).join("");

}


function deleteProduct(id){

if(!confirm("Ջնջե՞լ այս ապրանքը？"))

return;


products=
products.filter(p=>p.id!==id);

save();

renderAdmin();

}

</script>

</body>
</html>
