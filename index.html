<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VARELI — Online Shop</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f7f7f7;color:#111}
header{background:#fff;padding:15px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
.header{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:27px;font-weight:900;letter-spacing:3px}
button{border:0;padding:11px 15px;border-radius:10px;font-weight:bold;cursor:pointer}
.cartBtn{background:#111;color:#fff}
.hero,.search,.categories,.products{max-width:1100px;margin:20px auto;padding:0 15px}
.hero{padding:55px 25px;background:#111;color:#fff;border-radius:20px}
.hero h1{font-size:44px;margin-bottom:10px}
.hero p{color:#ccc;margin-bottom:20px}
.hero button{background:#fff}
.search input{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.categories{display:flex;gap:8px;overflow:auto}
.categories button{background:#fff;border:1px solid #ddd}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px #0001}
.card img{width:100%;height:210px;object-fit:cover;background:#eee}
.cardInfo{padding:14px}
.card h3{margin-bottom:8px}
.price{font-size:19px;font-weight:bold;margin-bottom:12px}
.add{width:100%;background:#111;color:#fff}
.panel{position:fixed;right:-100%;top:0;width:360px;max-width:100%;height:100%;background:#fff;z-index:100;padding:20px;transition:.3s;overflow:auto}
.panel.open{right:0}
.close{float:right;background:#eee}
.cartItem{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ddd}
.total{font-size:22px;font-weight:bold;margin:20px 0}
.checkout input,.checkout textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
.checkout button{width:100%;background:#111;color:#fff}
footer{text-align:center;padding:40px;color:#777}
@media(max-width:800px){
.products{grid-template-columns:repeat(2,1fr)}
.hero h1{font-size:34px}
}
</style>
</head>

<body>

<header>
<div class="header">
<div class="logo">VARELI</div>

<button class="cartBtn" onclick="openCart()">
🛒 <span id="cartCount">0</span>
</button>

</div>
</header>

<section class="hero">
<h1>VARELI</h1>
<p>Ընտրիր քո սիրած ապրանքները</p>
<button onclick="scrollProducts()">Գնել հիմա</button>
</section>

<div class="search">
<input id="search"
placeholder="🔎 Փնտրել ապրանք..."
oninput="renderProducts">
</div>

<div class="categories">
<button onclick="setCategory('all')">Բոլորը</button>
<button onclick="setCategory('beauty')">Beauty</button>
<button onclick="setCategory('accessories')">Աքսեսուարներ</button>
<button onclick="setCategory('new')">Նորույթներ</button>
</div>

<section class="products" id="products"></section>

<div class="panel" id="cartPanel">

<button class="close" onclick="closeCart()">✕</button>

<h2>🛒 Զամբյուղ</h2>

<div id="cart"></div>

<div class="total">
Ընդամենը՝ <span id="total">0</span> ֏
</div>

<div class="checkout">

<h3>Պատվեր</h3>

<input id="customerName" placeholder="Անուն Ազգանուն">
<input id="customerPhone" placeholder="Հեռախոսահամար">
<input id="customerAddress" placeholder="Հասցե">

<textarea id="customerNote" placeholder="Նշում"></textarea>

<button onclick="checkout()">Պատվիրել</button>

</div>
</div>

<footer>
© 2026 VARELI — Online Shop
</footer>

<script>

let products =
JSON.parse(localStorage.getItem("vareli_products")) || [
{
id:1,
name:"Vareli Beauty Cream",
price:5000,
image:"https://images.unsplash.com/photo-1556228578-8c89e6adf883",
category:"beauty"
},
{
id:2,
name:"Vareli Lip Tint",
price:6500,
image:"https://images.unsplash.com/photo-1586495777744-4413f21062fa",
category:"beauty"
},
{
id:3,
name:"Vareli Bag",
price:12000,
image:"https://images.unsplash.com/photo-1548036328-c9fa89d128fa",
category:"accessories"
},
{
id:4,
name:"Vareli New Collection",
price:15000,
image:"https://images.unsplash.com/photo-1529139574466-a303027c1d8b",
category:"new"
}
];

let cart =
JSON.parse(localStorage.getItem("vareli_cart")) || [];

let category="all";

function save(){
localStorage.setItem("vareli_products",JSON.stringify(products));
localStorage.setItem("vareli_cart",JSON.stringify(cart));
}

function renderProducts(){

let search=document.getElementById("search").value.toLowerCase();

let list=products.filter(p =>
(category==="all" || p.category===category) &&
p.name.toLowerCase().includes(search)
);

document.getElementById("products").innerHTML=list.map(p => `

<div class="card">

<img src="${p.image}"
onerror="this.src='https://via.placeholder.com/500'">

<div class="cardInfo">

<h3>${p.name}</h3>

<div class="price">
${p.price.toLocaleString()} ֏
</div>

${p.sizes && p.sizes.length ? `
<select id="size-${p.id}" class="sizeSelect">
  <option value="">Ընտրիր չափը</option>
  ${p.sizes.map(size => `<option value="${size}">${size}</option>`).join("")}
</select>
` : ""}

<button class="add" onclick="addCart(${p.id}, document.getElementById('size-${p.id}')?.value || '')">
  Ավելացնել զամբյուղ
</button>

</div>
</div>

`).join("");
}

function setCategory(c){
category=c;
renderProducts();
}

function addCart(id, size = ""){
  const product = products.find(x => x.id === id);

  if(product.sizes && product.sizes.length && !size){
    alert("Խնդրում ենք ընտրել չափը");
    return;
  }

  let item = cart.find(x => x.id === id && x.size === size);

  if(item){
    item.qty++;
  }else{
    cart.push({
      id: id,
      size: size,
      qty: 1
    });
  }

  save();
  renderCart();
}

function renderCart(){

let html="";
let total=0;
let count=0;

cart.forEach(item=>{

let p=products.find(x=>x.id===item.id);
if(!p)return;

let sum=p.price*item.qty;

total+=sum;
count+=item.qty;

html+=`

<div class="cartItem">

<div>
<button onclick="changeQty(${p.id},1,'${item.size || ""}')">+</button>
<button onclick="changeQty(${p.id},-1,'${item.size || ""}')">−</button>
</div>

</div>

`;
});

document.getElementById("cart").innerHTML=
html || "<p>Զամբյուղը դատարկ է։</p>";

document.getElementById("total").innerText=
total.toLocaleString();

document.getElementById("cartCount").innerText=count;
}

function changeQty(id, n, size = ""){
  let item = cart.find(x => x.id === id && x.size === size);
  if(!item)return;

  item.qty += n;

  if(item.qty <= 0){
    cart = cart.filter(x => !(x.id === id && x.size === size));
  }

  save();
  renderCart();
}

function openCart(){
document.getElementById("cartPanel").classList.add("open");
renderCart();
}

function closeCart(){
document.getElementById("cartPanel").classList.remove("open");
}

function checkout(){

if(cart.length===0){
alert("Զամբյուղը դատարկ է։");
return;
}

let name=document.getElementById("customerName").value;
let phone=document.getElementById("customerPhone").value;
let address=document.getElementById("customerAddress").value;

if(!name || !phone || !address){
alert("Լրացրու անունը, հեռախոսը և հասցեն։");
return;
}

let orders=
JSON.parse(localStorage.getItem("vareli_orders")) || [];

orders.push({
id:Date.now(),
name:name,
phone:phone,
address:address,
note:document.getElementById("customerNote").value,
cart:cart,
date:new Date().toLocaleString()
});

localStorage.setItem("vareli_orders",JSON.stringify(orders));

alert("✅ Պատվերը ընդունված է։");

cart=[];
save();
renderCart();
}

function scrollProducts(){
document.getElementById("products").scrollIntoView({
behavior:"smooth"
});
}

renderProducts();
renderCart();

</script>

</body>
</html>
