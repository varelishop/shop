<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vareli</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:25px;
  font-weight:bold;
  letter-spacing:5px;
}

.cartBtn{
  width:auto;
  margin:0;
  padding:11px 16px;
  background:white;
  color:#111;
}

.hero{
  padding:60px 20px;
  text-align:center;
  background:white;
}

.hero h1{
  font-size:42px;
  margin:0 0 10px;
}

.hero p{
  color:#777;
  font-size:17px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px;
}

.search{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:15px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:25px;
}

.categories button{
  width:auto;
  white-space:nowrap;
  background:white;
  color:#111;
  border:1px solid #ddd;
  padding:10px 18px;
}

.categories button.active{
  background:#111;
  color:white;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.mainImage{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
}

.thumbs{
  display:flex;
  gap:6px;
  padding:8px;
  overflow-x:auto;
}

.thumb{
  width:55px;
  height:55px;
  flex:none;
  object-fit:cover;
  border-radius:7px;
  cursor:pointer;
  border:2px solid transparent;
}

.thumb.active{
  border-color:#111;
}

.cardInfo{
  padding:14px;
}

.cardInfo h3{
  margin:0 0 8px;
  font-size:17px;
}

.price{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.sizeSelect{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:9px;
  margin-bottom:9px;
  background:white;
}

.add{
  background:#111;
  color:white;
  border:0;
  width:100%;
  padding:13px;
  border-radius:10px;
  font-weight:bold;
  font-size:15px;
}

.empty{
  text-align:center;
  padding:40px 10px;
  color:#777;
  grid-column:1/-1;
}

/* CART */

.cartOverlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:20;
}

.cart{
  position:fixed;
  right:0;
  top:0;
  height:100%;
  width:min(420px,92%);
  background:white;
  z-index:21;
  padding:20px;
  transform:translateX(100%);
  transition:.25s;
  overflow-y:auto;
}

.cart.open{
  transform:translateX(0);
}

.cartOverlay.open{
  display:block;
}

.cartHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  width:auto;
  background:#eee;
  color:#111;
  padding:8px 13px;
}

.cartItem{
  border-bottom:1px solid #eee;
  padding:15px 0;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.cartName{
  font-weight:bold;
  margin-bottom:6px;
}

.cartSize{
  color:#555;
  margin-bottom:5px;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty button{
  width:35px;
  padding:8px;
  margin:0;
  background:#111;
  color:white;
}

.total{
  font-size:20px;
  font-weight:bold;
  padding:20px 0;
  border-top:2px solid #111;
  margin-top:15px;
}

.checkout input,
.checkout textarea{
  width:100%;
  padding:13px;
  margin:6px 0;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px;
}

.checkout textarea{
  min-height:80px;
  resize:vertical;
}

.orderBtn{
  background:#111;
  color:white;
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  font-weight:bold;
  margin-top:8px;
}

@media(max-width:600px){

  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{
    font-size:32px;
  }

  .cardInfo{
    padding:11px;
  }

  .cardInfo h3{
    font-size:15px;
  }

  .price{
    font-size:16px;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    VARELI
  </div>

  <button
    class="cartBtn"
    onclick="openCart()">

    🛒 Զամբյուղ
    <span id="cartCount">0</span>

  </button>

</header>


<section class="hero">

  <h1>VARELI</h1>

  <p>
    Ընտրիր քո սիրելի ապրանքը
  </p>

</section>


<div class="container">

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 Փնտրել ապրանք..."
    oninput="renderProducts()">


  <div class="categories">

    <button
      class="active"
      onclick="setCategory('all',this)">
      Բոլորը
    </button>

    <button
      onclick="setCategory('beauty',this)">
      Beauty
    </button>

    <button
      onclick="setCategory('accessories',this)">
      Accessories
    </button>

    <button
      onclick="setCategory('new',this)">
      New
    </button>

  </div>


  <div
    id="products"
    class="products">
  </div>

</div>


<!-- CART -->

<div
  id="cartOverlay"
  class="cartOverlay"
  onclick="closeCart()">
</div>


<div
  id="cart"
  class="cart">

  <div class="cartHeader">

    <h2>Զամբյուղ</h2>

    <button
      class="close"
      onclick="closeCart()">
      ✕
    </button>

  </div>


  <div id="cartItems"></div>


  <div class="total">

    Ընդհանուր՝
    <span id="cartTotal">
      0 ֏
    </span>

  </div>


  <div class="checkout">

    <h3>Պատվիրել</h3>

    <input
      id="customerName"
      placeholder="Անուն">

    <input
      id="customerPhone"
      placeholder="Հեռախոս">

    <input
      id="customerAddress"
      placeholder="Հասցե">

    <textarea
      id="customerNote"
      placeholder="Նշում"></textarea>

    <button
      class="orderBtn"
      onclick="checkout()">

      Պատվիրել

    </button>

  </div>

</div>


<script>

const PRODUCTS_KEY =
"vareli_products";

const CART_KEY =
"vareli_cart";


let products = [];

let cart = [];

let category = "all";


/* LOAD PRODUCTS */

try{

  products =
    JSON.parse(
      localStorage.getItem(
        PRODUCTS_KEY
      )
    ) || [];

}catch(e){

  products=[];

}


/* LOAD CART */

try{

  cart =
    JSON.parse(
      localStorage.getItem(
        CART_KEY
      )
    ) || [];

}catch(e){

  cart=[];

}


/* NORMALIZE PRODUCTS */

products =
  products.map(p => {

    if(!Array.isArray(p.sizes)){

      if(typeof p.sizes === "string"){

        p.sizes =
          p.sizes
          .split(",")
          .map(s=>s.trim())
          .filter(Boolean);

      }else{

        p.sizes=[];

      }

    }


    if(!Array.isArray(p.images)){

      if(p.image){

        p.images=[p.image];

      }else{

        p.images=[];

      }

    }


    if(!p.image && p.images.length){

      p.image =
        p.images[0];

    }


    return p;

  });


/* SAVE */

function save(){

  localStorage.setItem(
    PRODUCTS_KEY,
    JSON.stringify(products)
  );

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

}


/* PRODUCTS */

function renderProducts(){

  const search =
    document
    .getElementById("search")
    .value
    .toLowerCase();


  const list =
    products.filter(p =>

      (category === "all" ||
       p.category === category)

      &&

      p.name
      .toLowerCase()
      .includes(search)

    );


  const box =
    document
    .getElementById("products");


  if(list.length===0){

    box.innerHTML =
      `<div class="empty">
        Ապրանքներ դեռ չկան։
      </div>`;

    return;

  }


  box.innerHTML =
    list.map(p => {

      const images =
        Array.isArray(p.images)
        && p.images.length
        ?
        p.images
        :
        [p.image];


      const firstImage =
        images[0]
        ||
        "https://via.placeholder.com/500";


      return `

        <div class="card">

          <img
            id="main-${p.id}"
            class="mainImage"
            src="${firstImage}"
            onerror="this.src='https://via.placeholder.com/500'"
          >


          ${
            images.length > 1
            ?
            `<div class="thumbs">

              ${
                images.map((img,i)=>`

                  <img
                    class="thumb ${i===0 ? "active":""}"
                    src="${img}"
                    onclick="changeMainImage(
                      ${p.id},
                      '${img.replace(/'/g,"&#39;")}',
                      this
                    )"
                  >

                `).join("")
              }

            </div>`
            :
            ""
          }


          <div class="cardInfo">

            <h3>
              ${p.name}
            </h3>

            <div class="price">
              ${Number(p.price || 0).toLocaleString()} ֏
            </div>


            ${
              p.sizes && p.sizes.length
              ?
              `
              <select
                id="size-${p.id}"
                class="sizeSelect">

                <option value="">
                  Ընտրիր չափը
                </option>

                ${
                  p.sizes.map(size=>
                    `<option value="${size}">
                      ${size}
                    </option>`
                  ).join("")
                }

              </select>
              `
              :
              ""
            }


            <button
              class="add"
              onclick="
                addCart(
                  ${p.id},
                  document.getElementById(
                    'size-${p.id}'
                  )?.value || ''
                )
              ">

              Ավելացնել զամբյուղ

            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* CHANGE MAIN IMAGE */

function changeMainImage(
  id,
  image,
  element
){

  const main =
    document.getElementById(
      "main-" + id
    );

  if(main){

    main.src = image;

  }


  const thumbs =
    element
    .parentElement
    .querySelectorAll(".thumb");


  thumbs.forEach(t =>
    t.classList.remove("active")
  );


  element.classList.add("active");

}


/* CATEGORY */

function setCategory(
  c,
  button
){

  category=c;


  document
    .querySelectorAll(".categories button")
    .forEach(b =>
      b.classList.remove("active")
    );


  button.classList.add("active");


  renderProducts();

}


/* ADD CART */

function addCart(
  id,
  size=""
){

  const product =
    products.find(
      p => p.id === id
    );


  if(!product)return;


  if(
    product.sizes &&
    product.sizes.length &&
    !size
  ){

    alert(
      "Խնդրում ենք ընտրել չափը"
    );

    return;

  }


  const item =
    cart.find(
      x =>
        x.id === id &&
        x.size === size
    );


  if(item){

    item.qty++;

  }else{

    cart.push({

      id:id,

      size:size,

      qty:1

    });

  }


  save();

  renderCart();

  openCart();

}


/* CART */

function renderCart(){

  let html="";

  let total=0;

  let count=0;


  cart.forEach(item => {

    const p =
      products.find(
        x => x.id === item.id
      );


    if(!p)return;


    const qty =
      Number(item.qty) || 1;


    const price =
      Number(p.price) || 0;


    total +=
      price * qty;


    count += qty;


    html += `

      <div class="cartItem">

        <div>

          <div class="cartName">
            ${p.name}
          </div>


          ${
            item.size
            ?
            `<div class="cartSize">
              Չափ՝ <b>${item.size}</b>
            </div>`
            :
            ""
          }


          <div>
            ${price.toLocaleString()}
            ֏ × ${qty}
          </div>

        </div>


        <div class="qty">

          <button
            onclick="
              changeQty(
                ${p.id},
                -1,
                '${String(
                  item.size || ""
                ).replace(/'/g,"&#39;")}'
              )
            ">

            −

          </button>


          <b>
            ${qty}
          </b>


          <button
            onclick="
              changeQty(
                ${p.id},
                1,
                '${String(
                  item.size || ""
                ).replace(/'/g,"&#39;")}'
              )
            ">

            +

          </button>

        </div>

      </div>

    `;

  });


  if(!html){

    html =
      `<div class="empty">
        Զամբյուղը դատարկ է։
      </div>`;

  }


  document
    .getElementById("cartItems")
    .innerHTML=html;


  document
    .getElementById("cartTotal")
    .innerText =
      total.toLocaleString()
      + " ֏";


  document
    .getElementById("cartCount")
    .innerText =
      count;

}


/* CHANGE QTY */

function changeQty(
  id,
  n,
  size=""
){

  const item =
    cart.find(
      x =>
        x.id === id &&
        x.size === size
    );


  if(!item)return;


  item.qty += n;


  if(item.qty <= 0){

    cart =
      cart.filter(
        x =>
          !(
            x.id === id &&
            x.size === size
          )
      );

  }


  save();

  renderCart();

}


/* OPEN CART */

function openCart(){

  document
    .getElementById("cart")
    .classList
    .add("open");


  document
    .getElementById("cartOverlay")
    .classList
    .add("open");

}


/* CLOSE CART */

function closeCart(){

  document
    .getElementById("cart")
    .classList
    .remove("open");


  document
    .getElementById("cartOverlay")
    .classList
    .remove("open");

}


/* CHECKOUT */

function checkout(){

  if(cart.length===0){

    alert(
      "Զամբյուղը դատարկ է"
    );

    return;

  }


  const name =
    document
    .getElementById("customerName")
    .value
    .trim();


  const phone =
    document
    .getElementById("customerPhone")
    .value
    .trim();


  const address =
    document
    .getElementById("customerAddress")
    .value
    .trim();


  if(!name ||
     !phone ||
     !address){

    alert(
      "Լրացրու անունը, հեռախոսը և հասցեն"
    );

    return;

  }


  let orders =
    JSON.parse(
      localStorage.getItem(
        "vareli_orders"
      )
    ) || [];


  orders.push({

    id:Date.now(),

    name:name,

    phone:phone,

    address:address,

    note:
      document
      .getElementById("customerNote")
      .value
      .trim(),

    cart:cart,

    date:new Date().toLocaleString()

  });


  localStorage.setItem(
    "vareli_orders",
    JSON.stringify(orders)
  );


  cart=[];

  save();

  renderCart();


  document
    .getElementById("customerName")
    .value="";


  document
    .getElementById("customerPhone")
    .value="";


  document
    .getElementById("customerAddress")
    .value="";


  document
    .getElementById("customerNote")
    .value="";


  alert(
    "Պատվերը ընդունվեց ✅"
  );

}


/* START */

renderProducts();

renderCart();

</script>

</body>
</html>
