<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vareli Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:22px;
  text-align:center;
}

header h1{
  margin:0;
  letter-spacing:5px;
}

.container{
  max-width:850px;
  margin:25px auto;
  padding:0 15px;
}

.panel{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

input,
select,
button{
  width:100%;
  padding:14px;
  margin:7px 0;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}

button{
  background:#111;
  color:white;
  border:0;
  font-weight:bold;
}

.addImage{
  background:#555;
}

.saveProduct{
  background:#111;
  margin-top:15px;
}

.imageList{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.imageBox{
  position:relative;
}

.imageBox img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:10px;
}

.removeImage{
  position:absolute;
  top:5px;
  right:5px;
  width:30px;
  height:30px;
  padding:0;
  margin:0;
  border-radius:50%;
  background:#d00;
}

.product{
  border:1px solid #eee;
  padding:15px;
  border-radius:15px;
  margin-top:15px;
  display:flex;
  gap:15px;
  align-items:center;
}

.product img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:10px;
}

.productInfo{
  flex:1;
}

.productInfo h3{
  margin:0 0 7px;
}

.delete{
  width:auto;
  background:#c00;
  padding:10px 15px;
}

.small{
  color:#777;
  font-size:14px;
  margin-top:5px;
}
</style>
</head>

<body>

<header>
<h1>VARELI</h1>
<div>ADMIN PANEL</div>
</header>

<div class="container">

<div class="panel">

<h2>Ավելացնել ապրանք</h2>

<input
id="pName"
type="text"
placeholder="Ապրանքի անունը">

<input
id="pPrice"
type="number"
placeholder="Գին ֏">

<select id="pCategory">

<option value="beauty">
Beauty
</option>

<option value="accessories">
Accessories
</option>

<option value="new">
New
</option>

</select>

<input
id="pSizes"
type="text"
placeholder="Չափեր՝ 40,41,42,43">

<h3>Ապրանքի նկարներ</h3>

<input
id="imageInput"
type="file"
accept="image/*"
style="display:none">

<button
class="addImage"
onclick="chooseImage()">

+ Ավելացնել նկար

</button>

<div id="imageList" class="imageList"></div>

<button
class="saveProduct"
onclick="addProduct()">

Ավելացնել ապրանքը

</button>

</div>


<div class="panel">

<h2>Ապրանքներ</h2>

<div id="products"></div>

</div>

</div>


<script>

const STORAGE_KEY =
"vareli_products";

let products = [];

let selectedImages = [];


/* Բեռնել ապրանքները */

try{

products =
JSON.parse(
localStorage.getItem(STORAGE_KEY)
) || [];

}catch(e){

products=[];

}


/* Նկար ընտրել */

function chooseImage(){

document
.getElementById("imageInput")
.click();

}


/* Երբ նկար ենք ընտրում */

document
.getElementById("imageInput")
.addEventListener(
"change",
function(){

const file =
this.files[0];

if(!file)return;


const reader =
new FileReader();


reader.onload =
function(e){

selectedImages.push(
e.target.result
);

renderImages();

};


reader.readAsDataURL(file);


/*
  Որպեսզի նույն նկարը
  նորից ընտրելու հնարավորություն լինի
*/

this.value="";

});


/* Նկարների ցուցադրում */

function renderImages(){

const box =
document.getElementById(
"imageList"
);

box.innerHTML =
"";


selectedImages.forEach(
(img,index)=>{

box.innerHTML += `

<div class="imageBox">

<img src="${img}">

<button
class="removeImage"
onclick="removeImage(${index})">

×
</button>

</div>

`;

});

}


/* Նկար ջնջել */

function removeImage(index){

selectedImages.splice(
index,
1
);

renderImages();

}


/* Ապրանք ավելացնել */

function addProduct(){

const name =
document
.getElementById("pName")
.value
.trim();


const price =
Number(
document
.getElementById("pPrice")
.value
);


const category =
document
.getElementById("pCategory")
.value;


const sizes =
document
.getElementById("pSizes")
.value
.split(",")
.map(s=>s.trim())
.filter(Boolean);


if(!name){

alert(
"Գրիր ապրանքի անունը"
);

return;

}


if(!price){

alert(
"Գրիր ապրանքի գինը"
);

return;

}


if(selectedImages.length===0){

alert(
"Ավելացրու առնվազն մեկ նկար"
);

return;

}


/* Ստեղծել ապրանք */

const product = {

id:Date.now(),

name:name,

price:price,

image:selectedImages[0],

images:[...selectedImages],

category:category,

sizes:sizes

};


products.push(product);


/* Պահել */

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(products)
);


/* Մաքրել */

document
.getElementById("pName")
.value="";

document
.getElementById("pPrice")
.value="";

document
.getElementById("pSizes")
.value="";

selectedImages=[];

renderImages();

renderProducts();


alert(
"Ապրանքը ավելացվեց ✅"
);

}


/* Ապրանքների ցուցադրում */

function renderProducts(){

const box =
document
.getElementById("products");


if(products.length===0){

box.innerHTML =
"<p>Ապրանքներ դեռ չկան։</p>";

return;

}


box.innerHTML =
products.map(p=>{

let imgs =
Array.isArray(p.images)
?
p.images
:
[p.image];


let sizes =
Array.isArray(p.sizes)
?
p.sizes.join(", ")
:
(p.sizes || "Չկա");


return `

<div class="product">

<img
src="${imgs[0]}"
onerror="this.style.display='none'">

<div class="productInfo">

<h3>
${p.name}
</h3>

<div>
<b>
${Number(p.price).toLocaleString()} ֏
</b>
</div>

<div class="small">
Չափեր՝ ${sizes}
</div>

<div class="small">
Նկարներ՝ ${imgs.length}
</div>

</div>

<button
class="delete"
onclick="deleteProduct(${p.id})">

Ջնջել

</button>

</div>

`;

}).join("");

}


/* Ջնջել ապրանքը */

function deleteProduct(id){

if(
!confirm(
"Ջնջե՞լ այս ապրանքը։"
)
){

return;

}


products =
products.filter(
p=>p.id!==id
);


localStorage.setItem(
STORAGE_KEY,
JSON.stringify(products)
);


renderProducts();

}


/* Սկզբնական ցուցադրում */

renderProducts();

</script>

</body>
</html>
